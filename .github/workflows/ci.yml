name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mysqli
          tools: phpunit:9

      - name: Lint PHP files
        run: find www tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: phpunit

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f docker/php/Dockerfile -t payroll-php .
